name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check tracked secrets and runtime files
        run: python scripts/check_secrets.py

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend steamkb.py

      - name: Run tests
        run: python -m pytest -q

      - name: Check frontend JavaScript
        run: python scripts/check_frontend.py

      - name: Check deployment shell scripts
        run: bash -n deploy/install_ubuntu.sh deploy/validate_linux.sh

      - name: Validate Nginx and systemd deployment
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          bash deploy/validate_linux.sh
