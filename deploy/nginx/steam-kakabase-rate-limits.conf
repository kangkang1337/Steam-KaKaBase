proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

limit_req_zone $binary_remote_addr zone=steamkb_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=steamkb_search:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=steamkb_admin:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=steamkb_detail:10m rate=1r/s;
# A short shared-IP burst is normal during account setup; FastAPI independently
# enforces the stricter rolling authentication window.
limit_req_zone $binary_remote_addr zone=steamkb_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=steamkb_favorites:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=steamkb_connections:10m;
