server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    client_max_body_size 32k;
    server_tokens off;
    limit_req_status 429;
    proxy_hide_header Server;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    limit_conn steamkb_connections 20;

    location = /api/search {
        limit_req zone=steamkb_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(track|untrack|refresh-all|games/[0-9]+/refresh)$ {
        limit_req zone=steamkb_admin burst=3 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=steamkb_public burst=30 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=steamkb_public burst=50 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
